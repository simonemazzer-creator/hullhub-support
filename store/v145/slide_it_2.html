<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(geist-sans-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:G;src:url(geist-sans-latin-500-normal.woff2);font-weight:500}
*{margin:0;box-sizing:border-box}body{width:1290px;height:2796px;overflow:hidden;font-family:G,sans-serif;

.t{position:absolute;top:150px;left:90px;right:90px;text-align:center;color:#fff}
h1{font-size:112px;line-height:1.05;font-weight:700;letter-spacing:-2px}
p{margin-top:38px;font-size:56px;font-weight:500;color:#c9d8f2;line-height:1.2}

.ph{position:absolute;left:50%;transform:translateX(-50%);bottom:-120px;width:1000px;border-radius:120px;background:#0a0f1a;padding:28px;box-shadow:0 40px 120px rgba(5,20,50,.45)}
