<style>
:root{--ink:#0B1F38;--accent:#C8102E;--soft:#EEF3F9;--line:#D9DEE5;--muted:#5A6472;--bg:#F4F6F9;--card:#fff;--ok:#1E7A46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#14213D;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 16px 18px}header .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}header h1{margin:4px 0 2px;font-size:24px}header p{margin:0;opacity:.85;font-size:14px}
.lang{float:right;display:flex;gap:4px;position:relative;z-index:2}.lang button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:3px 10px;font:inherit;font-size:13px}.lang button[aria-pressed=true]{background:#fff;color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.kv div b{display:block;font-size:16px}.kv div span{font-size:12px;color:var(--muted)}
ol.cl{padding-left:20px;margin:0;font-size:14px}ol.cl li{margin:0 0 8px}
label.f{display:block;margin:0 0 10px;font-size:13px;color:var(--muted)}label.f input,label.f select{display:block;width:100%;margin-top:4px;font:inherit;font-size:16px;color:#14213D;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}

.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:8px 0}.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin-top:1px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;font-size:16px;background:var(--accent);color:#fff;text-decoration:none;cursor:pointer}.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn[disabled]{opacity:.45}

.small{font-size:13px;color:var(--muted)}.guest{display:grid;grid-template-columns:1fr 130px 34px;gap:6px;margin:0 0 6px}.guest input{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:10px;width:100%}.guest button{border:0;background:var(--soft);border-radius:10px;font-size:18px}
.ok{background:#E8F5EE;border-color:#B8DFC8}.err{color:#B0102A;font-size:14px;margin:6px 0}
.sigbox{display:flex;align-items:center;justify-content:center;height:120px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-size:15px;cursor:pointer;width:100%;font:inherit}.sigbox img{max-height:110px;max-width:100%}
#sov{position:fixed;inset:0;z-index:50;background:#fff;overflow:hidden;touch-action:none}#sov .rot{display:flex;flex-direction:column;box-sizing:border-box;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 12px)}#sov .pad{position:relative;flex:1;display:flex;min-height:0}#sov .pad canvas{flex:1;width:100%;height:100%;touch-action:none}#sov .pad .line{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px dashed #b9c2cf;pointer-events:none}#sov .bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}#sov .bar span{flex:1;font-size:14px;color:var(--muted)}#sov .bar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600}#sov .bar button.ok{background:var(--accent);color:#fff;border-color:var(--accent)}#sov canvas{border-radius:12px;border:1px solid var(--line);background:#fff}
@media (max-width:420px){.g2{grid-template-columns:1fr}}
</style>

function payBox(){const P=D.pay;if(!P||!(P.pp||P.sp||P.iban))return '';const it=(L||'it')==='it';const due=+D.due||0;const amt=due>0?due:(+D.pr||0);
 const cz=(it?'Noleggio ':'Charter ')+(D.b||'')+' '+(D.f||'')+' '+(D.c||'');

const T={it:{k:'Contratto di noleggio',kl:'Contratto di locazione',sum:'Riepilogo',per:'Periodo',out:'Uscita',ret:'Rientro previsto',ppl:'Persone a bordo',zone:'Zona',price:'Prezzo',dep:'Caparra',cmd:'Comandante o conduttore',port:'Partenza da',op:'Locatore',cond:'Condizioni',you:'I tuoi dati',name:'Nome e cognome',bd:'Data di nascita',bp:'Luogo di nascita',cf:'Codice fiscale (se ce l’hai)',addr:'Residenza',tel:'Telefono',mail:'Email',dt:'Documento',dn:'Numero del documento',dph:'Foto del documento (obbligatoria)',greq:n=>`Obbligatorio: inserisci nome e data di nascita di tutte le altre persone a bordo${n>0?' ('+n+')':''}. La legge chiede l’elenco completo di chi sale a bordo.`,eBd:'La data di nascita non è valida.',eAdult:'Chi firma il contratto deve essere maggiorenne.',eDoc:'Aggiungi la foto del documento.',eG:n=>`Inserisci nome e data di nascita di tutte le altre persone a bordo (${n}).`,edit:'Ho sbagliato: modifica i dati e firma di nuovo',editN:'Puoi correggere i dati: poi firma di nuovo e manda il nuovo PDF.',guests:'Ospiti a bordo',gn:'Nome e cognome',gb:'Nato il',add:'Aggiungi un ospite',acc:'Ho letto e accetto le condizioni del contratto.',priv:'Acconsento al trattamento dei miei dati da parte del locatore per il contratto e per le comunicazioni obbligatorie all’Autorità marittima e all’Agenzia delle Entrate.',sig:'Firma',sigh:'Firma qui con il dito',sigt:'Tocca qui per firmare',rot:'Puoi girare il telefono in orizzontale',rot2:'Gira il telefono e firma sulla riga',cancel:'Annulla',ok:'Fatto',clr:'Cancella',go:'Firma e prepara il PDF',send:'Manda il PDF al locatore',wa:'Avvisa su WhatsApp',em:'Manda per email',done:'Contratto firmato: i tuoi dati sono arrivati al locatore. Mandagli anche il PDF firmato.',miss:'Completa nome, documento, le due conferme e la firma.',bad:'Link non valido. Chiedi al locatore di rimandarlo.',sp:'Approvazione specifica delle clausole (artt. 1341 e 1342 c.c.)',spa:'Approvo specificamente le clausole indicate qui sopra.',sig2:'Sec  cl:d=>[`Oggetto. ${d.t==='nat'&&d.k==='L'?'Il locatore concede in locazione':'Il locatore concede a noleggio'} l’unità ${d.b}${d.u?' (n. '+d.u+')':''}${d.m?' – '+d.m:''}${d.reg?', sigla '+d.reg:''}, per uso da diporto, nel periodo indicato.`,
 d.md==='solo'||d.k==='L'?`Conduzione. Il conduttore assume il comando e la responsabilità della navigazione e dichiara di avere l’abilitazione richiesta. Si impegna a rispettare le norme, le ordinanze locali e i limiti dell’unità.`:`Comando. L’unità è condotta dal comandante indicato dal locatore, che decide sulla navigazione e sulla sicurezza. Il cliente può indicare l’itinerario entro i limiti del contratto.`,

 `Meteo. Se le condizioni meteo-marine rendono rischiosa l’uscita, il locatore o il comandante può rinviarla o annullarla; in questo caso si concorda una nuova data o si restituisce quanto pagato.`,
 `Sicurezza. Prima della partenza il cliente riceve le istruzioni sull’uso delle dotazioni di sicurezza e le informazioni per le emergenze (1530, canale VHF 16).`,

 en:{k:'Charter agreement',kl:'Bareboat rental agreement',sum:'Summary',per:'Dates',out:'Departure',ret:'Expected return',ppl:'People on board',zone:'Area',price:'Price',dep:'Deposit',cmd:'Skipper',port:'Departing from',op:'Owner',cond:'Terms',you:'Your details',name:'Full name',bd:'Date of birth',bp:'Place of birth',cf:'Italian tax code (if any)',addr:'Address',tel:'Phone',mail:'Email',dt:'ID document',dn:'Document number',dph:'Photo of the document (required)',greq:n=>`Required: enter the name and date of birth of every other person on board${n>0?' ('+n+')':''}. The law requires the full list of people on board.`,eBd:'The date of birth is not valid.',eAdult:'The person signing must be at least 18.',eDoc:'Add a photo of your ID document.',eG:n=>`Enter the name and date of birth of every other person on board (${n}).`,edit:'I made a mistake: edit and sign again',editN:'You can correct your details, then sign again and send the new PDF.',guests:'Guests on board',gn:'Full name',gb:'Born on',add:'Add a guest',acc:'I have read and accept the terms of this agreement.',priv:'I agree that the owner processes my data for this agreement and for the notices required by law (maritime authority and Italian Revenue Agency).',sig:'Signature',sigh:'Sign here with your finger',sigt:'Tap here to sign',rot:'You can turn your phone sideways',rot2:'Turn your phone sideways and sign on the line',cancel:'Cancel',ok:'Done',clr:'Clear',go:'Sign and create the PDF',send:'Send the PDF to the owner',wa:'Tell the owner on WhatsApp',em:'Send by email',done:'Agreement signed: your details have reached the owner. Please also send them the signed PDF.',miss:'Fill in name, document, both confirmations and the signature.',bad:'Invalid link. Ask the owner to send it again.',sp:'Specific approval of clauses (Articles 1341 and 1342 of the Italian Civil Code)',spa:'I specifically approve the clauses listed above.',sig2:'Second signature, for the specific approval',fat:'Invoice details (if different): name or company, tax code or VAT number, address',miss2:'The second signature for the specifically approved clauses is also required.',hhnote:'Sample terms prepared by HullHub: the owner may replace them with their own.',note:'The details you enter go only to the owner, for the agreement and the notices required by law. The ID photo and signatures stay in the PDF you send.',docs:['ID card','Passport','Driving licence'],
 cl:d=>[`Subject. The owner ${d.t==='nat'&&d.k==='L'?'rents out (bareboat)':'charters'} the vessel ${d.b}${d.u?' (no. '+d.u+')':''}${d.m?' – '+d.m:''}${d.reg?', registration '+d.reg:''}, for leisure use, for the dates shown.`,

let L=(navigator.language||'it').startsWith('it')?'it':'en',D=null,S={guests:[],doc:'',sig:null,sig2:null},pdfBlob=null;
function cls(){const t=T[L];const c=D&&D.cl;if(c&&(c.it||c.en)){const s=(L==='en'&&c.en)?c.en:(c.it||c.en);return {own:1,list:String(s).split(/\n\s*\n|\n(?=\s*\d+[.)]\s)/).map(x=>x.trim()).filter(Boolean)}}return {own:0,list:t.cl(D)}}
function spx(){const c=D&&D.cl&&D.cl.sp;if(!c||!(c.it||c.en))return '';return String((L==='en'&&c.en)?c.en:(c.it||c.en)).trim()}
function wa(t){t=String(t||'').trim();let d=t.replace(/[^\d]/g,'');if(/^\+|^00/.test(t))return d.replace(/^00/,'');if(/^3\d{8,9}$/.test(d))return '39'+d;return d}
function dec(h){try{h=h.replace(/-/g,'+').replace(/_/g,'/');while(h.length%4)h+='=';return JSON.parse(decodeURIComponent(escape(atob(h))))}catch(e){return null}}
const $=s=>document.querySelector(s);const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fd(s){if(!s)return '';const d=new Date(s+'T12:00');return d.toLocaleDateString(L==='it'?'it-IT':'en-GB',{day:'numeric',month:'long',year:'numeric'})}
function eur(v){return v===''||v==null?'—':new Intl.NumberFormat(L==='it'?'it-IT':'en-GB',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(+v)}
function keep(){document.querySelectorAll('[data-k]').forEach(i=>{S[i.dataset.k]=i.type==='checkbox'?i.checked:i.value});S.guests=[...document.querySelectorAll('.guest')].map(g=>({n:g.querySelector('.gn').value,b:g.querySelector('.gb').value}))}
function render(){const t=T[L];document.documentElement.lang=L;document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
 if(!D){$('#app').innerHTML=`<div class="card"><p>${t.bad}</p></div>`;return}
 const loc=D.t==='nat'&&D.k==='L';$('[data-t=k]').textContent=loc?t.kl:t.k;$('#hb').textContent=D.b||'—';$('#hs').textContent=[D.op,D.p].filter(Boolean).join(' · ');
 if(pdfBlob){$('#app').innerHTML=`<div class="card ok"><p><b>${t.done}</b></p><button class="btn" id="share">${t.send}</button><button class="btn line" id="edit" style="margin-top:8px">${t.edit}</button>${D.ot?`<a class="btn line" style="margin-top:8px" target="_blank" href="https://wa.me/${wa(D.ot)}?text=${encodeURIComponent((L==='it'?'Ho firmato il contratto per il ':'I signed the agreement for ')+fd(D.f)+'. '+(L==='it'?'Ti mando il PDF.':'Sending you the PDF.'))}">${t.wa}</a>`:''}${D.oe?`<a class="btn line" style="margin-top:8px" href="mailto:${e(D.oe)}?subject=${encodeURIComponent((L==='it'?'Contratto firmato – ':'Signed agreement – ')+(D.c||''))}">${t.em}</a>`:''}</div>`;$('#share').onclick=sharePdf;$('#edit').onclick=()=>{pdfBlob=null;S.sig=null;S.sig2=null;S.acc=false;S.spok=false;render();setTimeout(()=>{const n=document.createElement('p');n.className='small';n.style.cssText='background:#fff7e0;border:1px solid #e8c66b;border-radius:10px;padding:10px;margin:0 0 12px;color:#5a4410';n.textContent=T[L].editN;$('#app').prepend(n);scrollTo(0,0)},0)};return}
 const row=(k,v)=>v?`<div><span>${k}</span><b>${e(v)}</b></div>`:'';
 $('#app').innerHTML=`<div class="card"><h2>${t.sum}</h2><div class="kv">${row(t.per,fd(D.f)+(D.to&&D.to!==D.f?' – '+fd(D.to):''))}${row(t.out,D.t1)}${row(t.ret,D.t2)}${row(t.ppl,D.n)}${row(t.zone,D.z)}${row(t.port,D.p)}${row(t.price,D.pr!==''?eur(D.pr):'')}${row(t.dep,D.dp!==''?eur(D.dp):'')}${row(t.cmd,D.cd)}${row(t.op,D.op)}</div></div>${payBox()}
 <div class="card"><h2>${t.cond}</h2>${(()=>{const C=cls();return C.own?C.list.map(x=>`<p style="font-size:14px;margin:0 0 8px;white-space:pre-line">${e(x)}</p>`).join(''):`<ol class="cl">${C.list.map(x=>`<li>${e(x)}</li>`).join('')}</ol><p class="small" style="margin:10px 0 0">${t.hhnote}</p>`})()}</div>
 <div class="card"><h2>${t.you}</h2><label class="f">${t.name}<input data-k="name" value="${e(S.name||D.c||'')}" autocomplete="name"></label>
 <div class="g2"><label class="f">${t.bd}<input type="date" data-k="bd" min="1900-01-01" max="${new Date().toISOString().slice(0,10)}" value="${e(S.bd||'')}"></label><label class="f">${t.bp}<input data-k="bp" value="${e(S.bp||'')}"></label></div>
 <label class="f">${t.addr}<input data-k="addr" value="${e(S.addr||'')}" autocomplete="street-address"></label>
 <div class="g2"><label class="f">${t.tel}<input type="tel" data-k="tel" value="${e(S.tel||'')}" autocomplete="tel"></label><label class="f">${t.mail}<input type="email" data-k="mail" value="${e(S.mail||'')}" autocomplete="email"></label></div>
 <div class="g2"><label class="f">${t.dt}<select data-k="dt">${t.docs.map(x=>`<option ${S.dt===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="f">${t.dn}<input data-k="dn" value="${e(S.dn||'')}"></label></div>
 <label class="f">${t.cf}<input data-k="cf" value="${e(S.cf||'')}" autocapitalize="characters"></label>
 <label class="f">${t.fat}<input data-k="fat" value="${e(S.fat||'')}"></label>
 <label class="f">${t.dph}<input type="file" accept="image/*" id="dph"></label>${S.doc?`<img src="${S.doc}" alt="" style="max-width:160px;border-radius:10px;border:1px solid var(--line)">`:''}</div>
 <div class="card"><h2>${t.guests}</h2><p class="small" style="margin:0 0 10px;color:var(--accent,#c8102e);font-weight:600">${t.greq(Math.max(0,(+D.n||1)-1))}</p><div id="gl">${S.guests.map(g=>`<div class="guest"><input class="gn" placeholder="${t.gn}" value="${e(g.n)}"><input class="gb" type="date" min="1900-01-01" max="${new Date().toISOString().slice(0,10)}" value="${e(g.b)}" aria-label="${t.gb}"><button type="button" class="gx" aria-label="x">×</button></div>`).join('')}</div><button class="btn line" id="ga" type="button">${t.add}</button></div>
 <div class="card"><label class="chk"><input type="checkbox" data-k="acc" ${S.acc?'checked':''}>${t.acc}</label><label class="chk"><input type="checkbox" data-k="priv" ${S.priv?'checked':''}>${t.priv}</label>
 <h2 style="margin-top:12px">${t.sig}</h2><button type="button" class="sigbox" id="sb">${S.sig?`<img src="${S.sig}" alt="">`:t.sigt}</button>
 ${spx()?`<h2 style="margin-top:16px">${t.sp}</h2><p style="font-size:14px;margin:0 0 8px;white-space:pre-line">${e(spx())}</p><label class="chk"><input type="checkbox" data-k="spok" ${S.spok?'checked':''}>${t.spa}</label><h2 style="margin-top:12px">${t.sig2}</h2><button type="button" class="sigbox" id="sb2">${S.sig2?`<img src="${S.sig2}" alt="">`:t.sigt}</button>`:''}
 <p class="err" id="er" hidden>${t.miss}</p><button class="btn" id="go" style="margin-top:12px">${t.go}</button><p class="small" style="margin:10px 0 0">${t.note}</p></div>`;
 if(!S._gi&&!S.guests.length&&+D.n>1){S._gi=1;for(let i=1;i<Math.min(+D.n,30);i++)S.guests.push({n:'',b:''});return render()}
 $('#ga').onclick=()=>{keep();S.guests.push({n:'',b:''});render()};document.querySelectorAll('.gx').forEach((b,i)=>b.onclick=()=>{keep();S.guests.splice(i,1);render()});
